spring:
  application:
    name: tally
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    # Migrations run as the schema owner; the application runs as tally_app (below),
    # which has no UPDATE or DELETE on the journal. The owner credentials are throwaway
    # local defaults matching compose.yaml; override them through the environment.
    # Flyway reuses the datasource URL.
    user: ${DATABASE_OWNER_USER:tally}
    password: ${DATABASE_OWNER_PASSWORD:tally}
    placeholders:
      # Password given to the tally_app role when V3 creates it.
      appPassword: ${DATABASE_PASSWORD:tally_app}
  jackson:
    time-zone: UTC
    deserialization:
      # Amounts are whole cents: 100.75 must be a 400, never silently cut to 100.
      accept-float-as-int: false
  transaction:
    # Starting value, not a measurement: a ledger transaction is a few indexed
    # statements, so 5 s is far above normal and still ends a stalled one well
    # before callers give up. Applied as a statement timeout inside the
    # transaction. Phase 8 measures it and may change it.
    default-timeout: 5s
  datasource:
    # The application connects as tally_app, never as the owner. compose.yaml marks its
    # postgres service as ignored by Docker Compose support, and the test containers
    # set these properties themselves, so these values apply in every environment. The
    # defaults are throwaway local values matching compose.yaml; override them through
    # the environment.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tally}
    username: ${DATABASE_USER:tally_app}
    password: ${DATABASE_PASSWORD:tally_app}
    hikari:
      # Starting value, not a measurement: few connections keep Postgres from
      # thrashing, and posting transactions hold row locks, so a small pool also
      # caps lock contention. Phase 8 measures it and may change it.
      maximum-pool-size: 10
      # Starting value (ms): fail fast on a saturated pool rather than hang
      # callers. Mapping this failure to a 503 problem response comes later.
      connection-timeout: 2000
      # Pins every session to UTC regardless of the JVM or server default.
      connection-init-sql: SET TIME ZONE 'UTC'
  kafka:
    producer:
      # A send counts as published only once every in-sync replica has it.
      acks: all
      properties:
        # The broker drops the producer's own retries of a batch it already wrote. It cannot drop the
        # outbox relay sending a batch again after a rollback; consumers dedupe on entry_id for that.
        "[enable.idempotence]": true
        # Starting values, not measurements. The outbox relay waits at most 4 s for acks while it holds its
        # rows locked, so a send must succeed or fail within that; a failed batch rolls back and the next
        # run retries it. Kafka requires delivery.timeout.ms >= linger.ms + request.timeout.ms.
        "[delivery.timeout.ms]": 3000
        "[request.timeout.ms]": 2000
        # How long send() itself may block waiting for topic metadata or buffer space.
        "[max.block.ms]": 1000
    template:
      # Each send gets a producer span that ends when Kafka acknowledges the record; the outbox
      # tags it with the entry_id.
      observation-enabled: true

logging:
  structured:
    format:
      # One JSON object per line, with the MDC (traceId, spanId, entry_id, idempotency_key) as fields.
      # Lines go to the console only and are not sent to Loki: Spring Boot has no stable Logback bridge to OTLP.
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      # Every posting and every publish is traced, so any entry can be followed by its id. Starting
      # value, not a measurement; Phase 8 measures the cost, and a busy production system would sample.
      probability: 1.0
  observations:
    enable:
      # Spring observes every @Scheduled run, and the relay runs every 200 ms, which would make five
      # empty traces a second. The relay starts its own observation when it has rows to publish.
      "[tasks.scheduled.execution]": false
  metrics:
    distribution:
      percentiles-histogram:
        # Buckets let the dashboard compute p95 and p99, which a client-side percentile cannot do
        # across instances.
        "[ledger.posting.duration]": true
        "[ledger.lock.wait]": true
  otlp:
    metrics:
      export:
        # Starting value: with the 1 min default, a stuck relay or new drift takes a minute to show
        # on the dashboard. Phase 8 may change it.
        step: 10s
  logging:
    export:
      otlp:
        # Log lines stay on the console (logging.structured above), so there is nothing to export. Spring Boot
        # still builds its log batch processor, which then wraps a no-op exporter and stays idle.
        enabled: false

tally:
  admin:
    # Admin endpoints (/admin/**) take this key as a Bearer token. There is no default: while it is
    # unset, every admin request is refused. Set TALLY_ADMIN_API_KEY to a random value of at least
    # 32 characters, for example `openssl rand -hex 32`.
    api-key: ${TALLY_ADMIN_API_KEY:}
