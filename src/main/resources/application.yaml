spring:
  application:
    name: tally
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    # Migrations run as the schema owner; the application runs as tally_app (below),
    # which has no UPDATE or DELETE on the journal. The owner credentials are throwaway
    # local defaults matching compose.yaml; override them through the environment.
    # Flyway reuses the datasource URL.
    user: ${DATABASE_OWNER_USER:tally}
    password: ${DATABASE_OWNER_PASSWORD:tally}
    placeholders:
      # Password given to the tally_app role when V3 creates it.
      appPassword: ${DATABASE_PASSWORD:tally_app}
  jackson:
    time-zone: UTC
    deserialization:
      # Amounts are whole cents: 100.75 must be a 400, never silently cut to 100.
      accept-float-as-int: false
  transaction:
    # Starting value, not a measurement: a ledger transaction is a few indexed
    # statements, so 5 s is far above normal and still ends a stalled one well
    # before callers give up. Applied as a statement timeout inside the
    # transaction. Phase 8 measures it and may change it.
    default-timeout: 5s
  datasource:
    # The application connects as tally_app, never as the owner. compose.yaml marks its
    # postgres service as ignored by Docker Compose support, and the test containers
    # set these properties themselves, so these values apply in every environment. The
    # defaults are throwaway local values matching compose.yaml; override them through
    # the environment.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tally}
    username: ${DATABASE_USER:tally_app}
    password: ${DATABASE_PASSWORD:tally_app}
    hikari:
      # Starting value, not a measurement: few connections keep Postgres from
      # thrashing, and posting transactions hold row locks, so a small pool also
      # caps lock contention. Phase 8 measures it and may change it.
      maximum-pool-size: 10
      # Starting value (ms): fail fast on a saturated pool rather than hang
      # callers. Mapping this failure to a 503 problem response comes later.
      connection-timeout: 2000
      # Pins every session to UTC regardless of the JVM or server default.
      connection-init-sql: SET TIME ZONE 'UTC'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
